- conMenu:
    Control: GroupContainer
    Variant: ManualLayout
    Properties:
      X: =0
      Y: =0
      Width: =Parent.Width
      Height: =Parent.Height
      Fill: =RGBA(255, 255, 251, 1)
    Children:
      - lblMenuTitle:
          Control: Label
          Properties:
            Text: ="Ballon TD · data entry"
            X: =24
            Y: =16
            Width: =900
            Height: =40
            Size: =20
            FontWeight: =FontWeight.Semibold
      - lblMenuPerson:
          Control: Label
          Properties:
            Text: |-
              ="Selected in the report: " & Coalesce(First(PowerBIIntegration.Data).'Full name', "nobody (pick a person on each form)")
            X: =24
            Y: =56
            Width: =900
            Height: =30
            Size: =11
            Color: =RGBA(107, 113, 106, 1)
      - btnMenuCoaching:
          Control: Classic/Button
          Properties:
            Text: ="Coaching session"
            X: =24
            Y: =104
            Width: =320
            Height: =48
            Fill: =RGBA(228, 247, 199, 1)
            Color: =RGBA(93, 119, 13, 1)
            RadiusTopLeft: =12
            RadiusTopRight: =12
            RadiusBottomLeft: =12
            RadiusBottomRight: =12
            OnSelect: =Navigate(scrCoaching, ScreenTransition.None)
      - btnMenuValidation:
