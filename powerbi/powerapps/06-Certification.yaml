- conCertification:
    Control: GroupContainer
    Variant: ManualLayout
    Properties:
      X: =0
      Y: =0
      Width: =Parent.Width
      Height: =Parent.Height
      Fill: =RGBA(255, 255, 251, 1)
    Children:
      - lblCertificationTitle:
          Control: Label
          Properties:
            Text: ="Certification record"
            X: =24
            Y: =16
            Width: =900
            Height: =40
            Size: =20
            FontWeight: =FontWeight.Semibold
            Color: =RGBA(20, 30, 18, 1)
      - lblCertificationSub:
          Control: Label
          Properties:
            Text: ="Professional (S1) or AI (S3) certification progress."
            X: =24
            Y: =56
            Width: =900
            Height: =30
            Size: =11
            Color: =RGBA(107, 113, 106, 1)
      - lblCbCertificationPerson:
          Control: Label
          Properties:
            Text: ="Person *"
            X: =24
            Y: =96
            Width: =440
            Height: =22
            Size: =10
            Color: =RGBA(96, 103, 96, 1)
      - cbCertificationPerson:
          Control: Classic/ComboBox
          Properties:
            X: =24
            Y: =120
            Width: =440
            Height: =40
            Items: =SortByColumns(tbl_Employee, "name")
            DisplayFields: =["name"]
            SearchFields: =["name", "jobTitle", "id"]
            SelectMultiple: =false
            DefaultSelectedItems: =Filter(tbl_Employee, id = First(PowerBIIntegration.Data).'Employee ID')
      - lblCbCertificationCertification:
          Control: Label
          Properties:
            Text: ="Certification *"
            X: =488
            Y: =96
            Width: =440
            Height: =22
            Size: =10
            Color: =RGBA(96, 103, 96, 1)
      - cbCertificationCertification:
          Control: Classic/ComboBox
          Properties:
            X: =488
            Y: =120
            Width: =440
            Height: =40
            Items: =SortByColumns(tbl_Certification, "name")
            DisplayFields: =["name"]
            SearchFields: =["name"]
            SelectMultiple: =false
      - lblCbCertificationStatus:
          Control: Label
          Properties:
            Text: ="Status *"
            X: =24
            Y: =170
            Width: =440
            Height: =22
            Size: =10
            Color: =RGBA(96, 103, 96, 1)
      - cbCertificationStatus:
          Control: Classic/ComboBox
          Properties:
            X: =24
            Y: =194
            Width: =440
            Height: =40
            Items: =Sort(Filter(tbl_LookupValue, list = "certStatus" && active), sortOrder)
            DisplayFields: =["value"]
            SearchFields: =["value"]
            SelectMultiple: =false
            DefaultSelectedItems: =Filter(tbl_LookupValue, list = "certStatus" && value = "Assigned")
      - lblDpCertificationTargetDate:
          Control: Label
          Properties:
            Text: ="Target date"
            X: =488
            Y: =170
            Width: =440
            Height: =22
            Size: =10
            Color: =RGBA(96, 103, 96, 1)
      - dpCertificationTargetDate:
          Control: Classic/DatePicker
          Properties:
            X: =488
            Y: =194
            Width: =440
            Height: =40
            DefaultDate: =Blank()
            Format: ="yyyy-mm-dd"
      - lblDpCertificationExamDate:
          Control: Label
          Properties:
            Text: ="Exam date"
            X: =24
            Y: =244
            Width: =440
            Height: =22
            Size: =10
            Color: =RGBA(96, 103, 96, 1)
      - dpCertificationExamDate:
          Control: Classic/DatePicker
          Properties:
            X: =24
            Y: =268
            Width: =440
            Height: =40
            DefaultDate: =Blank()
            Format: ="yyyy-mm-dd"
      - lblDpCertificationCompletionDate:
          Control: Label
          Properties:
            Text: ="Achieved"
            X: =488
            Y: =244
            Width: =440
            Height: =22
            Size: =10
            Color: =RGBA(96, 103, 96, 1)
      - dpCertificationCompletionDate:
          Control: Classic/DatePicker
          Properties:
            X: =488
            Y: =268
            Width: =440
            Height: =40
            DefaultDate: =Blank()
            Format: ="yyyy-mm-dd"
      - lblCbCertificationResult:
          Control: Label
          Properties:
            Text: ="Result"
            X: =24
            Y: =318
            Width: =440
            Height: =22
            Size: =10
            Color: =RGBA(96, 103, 96, 1)
      - cbCertificationResult:
          Control: Classic/ComboBox
          Properties:
            X: =24
            Y: =342
            Width: =440
            Height: =40
            Items: =Sort(Filter(tbl_LookupValue, list = "examResult" && active), sortOrder)
            DisplayFields: =["value"]
            SearchFields: =["value"]
            SelectMultiple: =false
      - lblTxtCertificationScore:
          Control: Label
          Properties:
            Text: ="Score"
            X: =488
            Y: =318
            Width: =440
            Height: =22
            Size: =10
            Color: =RGBA(96, 103, 96, 1)
      - txtCertificationScore:
          Control: Classic/TextInput
          Properties:
            X: =488
            Y: =342
            Width: =440
            Height: =40
            Default: =""
            Format: =TextFormat.Number
      - lblTxtCertificationCertificateUrl:
          Control: Label
          Properties:
            Text: ="Certificate link"
            X: =24
            Y: =392
            Width: =440
            Height: =22
            Size: =10
            Color: =RGBA(96, 103, 96, 1)
      - txtCertificationCertificateUrl:
          Control: Classic/TextInput
          Properties:
            X: =24
            Y: =416
            Width: =440
            Height: =40
            Default: =""
            HintText: =""
      - lblTxtCertificationComments:
          Control: Label
          Properties:
            Text: ="Comments"
            X: =24
            Y: =466
            Width: =904
            Height: =22
            Size: =10
            Color: =RGBA(96, 103, 96, 1)
      - txtCertificationComments:
          Control: Classic/TextInput
          Properties:
            X: =24
            Y: =490
            Width: =904
            Height: =72
            Default: =""
            Mode: =TextMode.MultiLine
            HintText: =""
      - lblCbCertificationSource:
          Control: Label
          Properties:
            Text: ="Source"
            X: =24
            Y: =540
            Width: =440
            Height: =22
            Size: =10
            Color: =RGBA(96, 103, 96, 1)
      - cbCertificationSource:
          Control: Classic/ComboBox
          Properties:
            X: =24
            Y: =564
            Width: =440
            Height: =40
            Items: =Sort(Filter(tbl_LookupValue, list = "source" && active), sortOrder)
            DisplayFields: =["value"]
            SearchFields: =["value"]
            SelectMultiple: =false
            DefaultSelectedItems: =Filter(tbl_LookupValue, list = "source" && value = "Direct entry")
      - btnCertificationSave:
          Control: Classic/Button
          Properties:
            Text: ="Save"
            X: =24
            Y: =622
            Width: =160
            Height: =44
            Fill: =RGBA(147, 201, 38, 1)
            Color: =RGBA(20, 30, 18, 1)
            HoverFill: =RGBA(125, 176, 26, 1)
            RadiusTopLeft: =22
            RadiusTopRight: =22
            RadiusBottomLeft: =22
            RadiusBottomRight: =22
            DisplayMode: =If(IsBlank(cbCertificationPerson.Selected.id) || IsBlank(cbCertificationCertification.Selected) || IsBlank(cbCertificationStatus.Selected.value), DisplayMode.Disabled, DisplayMode.Edit)
            OnSelect: |-
              =Patch(tbl_CertificationRecord, Defaults(tbl_CertificationRecord), {
                  id: "CER-PA" & Text(Now(), "yymmddhhmmss"),
                  employeeId: cbCertificationPerson.Selected.id,
                  certificationId: cbCertificationCertification.Selected.id,
                  status: cbCertificationStatus.Selected.value,
                  targetDate: If(IsBlank(dpCertificationTargetDate.SelectedDate), Blank(), Text(dpCertificationTargetDate.SelectedDate, "yyyy-mm-dd")),
                  examDate: If(IsBlank(dpCertificationExamDate.SelectedDate), Blank(), Text(dpCertificationExamDate.SelectedDate, "yyyy-mm-dd")),
                  completionDate: If(IsBlank(dpCertificationCompletionDate.SelectedDate), Blank(), Text(dpCertificationCompletionDate.SelectedDate, "yyyy-mm-dd")),
                  result: cbCertificationResult.Selected.value,
                  score: If(IsBlank(txtCertificationScore.Text), Blank(), Value(txtCertificationScore.Text)),
                  certificateUrl: If(IsBlank(txtCertificationCertificateUrl.Text), Blank(), txtCertificationCertificateUrl.Text),
                  comments: If(IsBlank(txtCertificationComments.Text), Blank(), txtCertificationComments.Text),
                  source: cbCertificationSource.Selected.value,
                  createdAt: Text(Now(), "yyyy-mm-dd hh:mm:ss"),
                  createdBy: User().FullName,
                  updatedAt: Text(Now(), "yyyy-mm-dd hh:mm:ss"),
                  updatedBy: User().FullName
              });
              Notify("Certification record saved. It appears in the report after the next refresh.", NotificationType.Success);
              Reset(cbCertificationCertification); Reset(cbCertificationStatus); Reset(dpCertificationTargetDate); Reset(dpCertificationExamDate); Reset(dpCertificationCompletionDate); Reset(cbCertificationResult); Reset(txtCertificationScore); Reset(txtCertificationCertificateUrl); Reset(txtCertificationComments); Reset(cbCertificationSource)
      - btnCertificationClear:
          Control: Classic/Button
          Properties:
            Text: ="Clear"
            X: =200
            Y: =622
            Width: =120
            Height: =44
            Fill: =RGBA(255, 255, 255, 1)
            Color: =RGBA(20, 30, 18, 1)
            BorderColor: =RGBA(0, 26, 0, 0.15)
            BorderThickness: =1
            HoverFill: =RGBA(0, 39, 0, 0.05)
            RadiusTopLeft: =22
            RadiusTopRight: =22
            RadiusBottomLeft: =22
            RadiusBottomRight: =22
            OnSelect: =Reset(cbCertificationPerson); Reset(cbCertificationCertification); Reset(cbCertificationStatus); Reset(dpCertificationTargetDate); Reset(dpCertificationExamDate); Reset(dpCertificationCompletionDate); Reset(cbCertificationResult); Reset(txtCertificationScore); Reset(txtCertificationCertificateUrl); Reset(txtCertificationComments); Reset(cbCertificationSource)
      - btnCertificationBack:
          Control: Classic/Button
          Properties:
            Text: ="← Menu"
            X: =Parent.Width - 144
            Y: =20
            Width: =120
            Height: =36
            Fill: =RGBA(255, 255, 255, 1)
            Color: =RGBA(20, 30, 18, 1)
            BorderColor: =RGBA(0, 26, 0, 0.15)
            BorderThickness: =1
            OnSelect: =Navigate(scrMenu, ScreenTransition.None)
