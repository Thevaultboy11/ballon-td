- conObs:
    Control: GroupContainer
    Variant: ManualLayout
    Properties:
      X: =0
      Y: =0
      Width: =Parent.Width
      Height: =Parent.Height
      Fill: =RGBA(255, 255, 251, 1)
    Children:
      - lblObsTitle:
          Control: Label
          Properties:
            Text: ="Observation scores (cross-functional table)"
            X: =24
            Y: =16
            Width: =900
            Height: =40
            Size: =20
            FontWeight: =FontWeight.Semibold
            Color: =RGBA(20, 30, 18, 1)
      - lblObsSub:
          Control: Label
          Properties:
            Text: |-
              ="One person, one programme day: attendance, the 25 behaviours (1–5), potential / risk note and assessor notes."
            X: =24
            Y: =56
            Width: =900
            Height: =30
            Size: =11
            Color: =RGBA(107, 113, 106, 1)
      - lblObsPerson:
          Control: Label
          Properties:
            Text: ="Attendee *"
            X: =24
            Y: =96
            Width: =300
            Height: =22
            Size: =10
            Color: =RGBA(96, 103, 96, 1)
      - cbObsPerson:
          Control: Classic/ComboBox
          Properties:
            X: =24
            Y: =120
            Width: =300
            Height: =40
            Items: =SortByColumns(tbl_Employee, "name")
            DisplayFields: =["name"]
            SearchFields: =["name"]
            SelectMultiple: =false
            DefaultSelectedItems: =Filter(tbl_Employee, id = First(PowerBIIntegration.Data).'Employee ID')
      - lblObsSession:
          Control: Label
          Properties:
            Text: ="Session *"
            X: =340
            Y: =96
            Width: =300
            Height: =22
            Size: =10
            Color: =RGBA(96, 103, 96, 1)
      - cbObsSession:
          Control: Classic/ComboBox
          Properties:
            X: =340
            Y: =120
            Width: =220
            Height: =40
            Items: =SortByColumns(Filter(tbl_CourseSession, id in Filter(tbl_TrainingRecord, employeeId = cbObsPerson.Selected.id).sessionId), "startDate", SortOrder.Descending)
            DisplayFields: =["id"]
            SearchFields: =["id"]
            SelectMultiple: =false
      - lblObsDay:
          Control: Label
          Properties:
            Text: ="Day"
            X: =576
            Y: =96
            Width: =80
            Height: =22
            Size: =10
            Color: =RGBA(96, 103, 96, 1)
      - ddObsDay:
          Control: Classic/DropDown
          Properties:
            X: =576
            Y: =120
            Width: =80
            Height: =40
            Items: =[1, 2, 3, 4, 5]
      - lblObsDate:
          Control: Label
          Properties:
            Text: ="Date"
            X: =672
            Y: =96
            Width: =160
            Height: =22
            Size: =10
            Color: =RGBA(96, 103, 96, 1)
      - dpObsDate:
          Control: Classic/DatePicker
          Properties:
            X: =672
            Y: =120
            Width: =170
            Height: =40
            DefaultDate: =Today()
            Format: ="yyyy-mm-dd"
      - lblObsAttendance:
          Control: Label
          Properties:
            Text: ="Attendance"
            X: =858
            Y: =96
            Width: =160
            Height: =22
            Size: =10
            Color: =RGBA(96, 103, 96, 1)
      - cbObsAttendance:
          Control: Classic/ComboBox
          Properties:
            X: =858
            Y: =120
            Width: =160
            Height: =40
            Items: =Sort(Filter(tbl_LookupValue, list = "attendance" && active), sortOrder)
            DisplayFields: =["value"]
            SearchFields: =["value"]
            SelectMultiple: =false
            DefaultSelectedItems: =Filter(tbl_LookupValue, list = "attendance" && value = "Present")
      - galObs:
          Control: Gallery
          Variant: Vertical
          Properties:
            X: =24
            Y: =176
            Width: =820
            Height: =Parent.Height - 200
            Items: =SortByColumns(Filter(tbl_ObservationParameter, active), "sortOrder")
            TemplateSize: =44
            TemplatePadding: =0
          Children:
            - lblObsParam:
                Control: Label
                Properties:
                  Text: =ThisItem.name
                  X: =8
                  Y: =4
                  Width: =420
                  Height: =36
                  Size: =11
            - lblObsCat:
                Control: Label
                Properties:
                  Text: =ThisItem.category
                  X: =436
                  Y: =4
                  Width: =230
                  Height: =36
                  Size: =10
                  Color: =RGBA(107, 113, 106, 1)
            - ddObsScore:
                Control: Classic/DropDown
                Properties:
                  X: =676
                  Y: =4
                  Width: =120
                  Height: =36
                  Items: =["", "1", "2", "3", "4", "5"]
                  Default: =""
      - lblObsPotential:
          Control: Label
          Properties:
            Text: ="Potential / risk note"
            X: =868
            Y: =176
            Width: =360
            Height: =22
            Size: =10
            Color: =RGBA(96, 103, 96, 1)
      - cbObsPotential:
          Control: Classic/ComboBox
          Properties:
            X: =868
            Y: =200
            Width: =360
            Height: =40
            Items: =Sort(Filter(tbl_LookupValue, list = "potentialNote" && active), sortOrder)
            DisplayFields: =["value"]
            SearchFields: =["value"]
            SelectMultiple: =false
      - lblObsNotes:
          Control: Label
          Properties:
            Text: ="Assessor notes"
            X: =868
            Y: =256
            Width: =360
            Height: =22
            Size: =10
            Color: =RGBA(96, 103, 96, 1)
      - txtObsNotes:
          Control: Classic/TextInput
          Properties:
            X: =868
            Y: =280
            Width: =360
            Height: =160
            Mode: =TextMode.MultiLine
            Default: =""
      - btnObsSave:
          Control: Classic/Button
          Properties:
            Text: ="Save day"
            X: =868
            Y: =460
            Width: =160
            Height: =44
            Fill: =RGBA(147, 201, 38, 1)
            Color: =RGBA(20, 30, 18, 1)
            RadiusTopLeft: =22
            RadiusTopRight: =22
            RadiusBottomLeft: =22
            RadiusBottomRight: =22
            DisplayMode: =If(IsBlank(cbObsPerson.Selected.id) || IsBlank(cbObsSession.Selected.id), DisplayMode.Disabled, DisplayMode.Edit)
            OnSelect: |-
              =With({tr: LookUp(tbl_TrainingRecord, employeeId = cbObsPerson.Selected.id && sessionId = cbObsSession.Selected.id), dayId: "OBS-PA" & Text(Now(), "yymmddhhmmss")},
                  If(IsBlank(tr.id),
                      Notify("This person is not on that session. Add a training record first.", NotificationType.Error),
                      Patch(tbl_ObservationDay, Defaults(tbl_ObservationDay), {
                          id: dayId, trainingRecordId: tr.id, dayNumber: ddObsDay.Selected.Value,
                          date: Text(dpObsDate.SelectedDate, "yyyy-mm-dd"), attendance: cbObsAttendance.Selected.value,
                          potentialNote: cbObsPotential.Selected.value, notes: txtObsNotes.Text, source: "Trainer sheet",
                          createdAt: Text(Now(), "yyyy-mm-dd hh:mm:ss"), createdBy: User().FullName, updatedAt: Text(Now(), "yyyy-mm-dd hh:mm:ss"), updatedBy: User().FullName
                      });
                      ForAll(Filter(galObs.AllItems, !IsBlank(ThisRecord.ddObsScore.Selected.Value) && ThisRecord.ddObsScore.Selected.Value <> ""),
                          Patch(tbl_ObservationScore, Defaults(tbl_ObservationScore), {
                              id: dayId & "-" & ThisRecord.code, observationDayId: dayId, parameterId: ThisRecord.id, score: Value(ThisRecord.ddObsScore.Selected.Value)
                          })
                      );
                      Notify("Day " & ddObsDay.Selected.Value & " saved for " & cbObsPerson.Selected.name, NotificationType.Success)
                  )
              )
      - btnObsBack:
          Control: Classic/Button
          Properties:
            Text: ="← Menu"
            X: =Parent.Width - 144
            Y: =20
            Width: =120
            Height: =36
            Fill: =RGBA(255, 255, 255, 1)
            Color: =RGBA(20, 30, 18, 1)
            BorderColor: =RGBA(0, 26, 0, 0.15)
            BorderThickness: =1
            OnSelect: =Navigate(scrMenu, ScreenTransition.None)
