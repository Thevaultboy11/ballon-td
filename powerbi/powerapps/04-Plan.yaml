- conPlan:
    Control: GroupContainer
    Variant: ManualLayout
    Properties:
      X: =0
      Y: =0
      Width: =Parent.Width
      Height: =Parent.Height
      Fill: =RGBA(255, 255, 251, 1)
    Children:
      - lblPlanTitle:
          Control: Label
          Properties:
            Text: ="Development action"
            X: =24
            Y: =16
            Width: =900
            Height: =40
            Size: =20
            FontWeight: =FontWeight.Semibold
            Color: =RGBA(20, 30, 18, 1)
      - lblPlanSub:
          Control: Label
          Properties:
            Text: ="IDP segment, department training need or workplace assignment."
            X: =24
            Y: =56
            Width: =900
            Height: =30
            Size: =11
            Color: =RGBA(107, 113, 106, 1)
      - lblCbPlanPerson:
          Control: Label
          Properties:
            Text: ="Person *"
            X: =24
            Y: =96
            Width: =440
            Height: =22
            Size: =10
            Color: =RGBA(96, 103, 96, 1)
      - cbPlanPerson:
          Control: Classic/ComboBox
          Properties:
            X: =24
            Y: =120
            Width: =440
            Height: =40
            Items: =SortByColumns(tbl_Employee, "name")
            DisplayFields: =["name"]
            SearchFields: =["name", "jobTitle", "id"]
            SelectMultiple: =false
            DefaultSelectedItems: =Filter(tbl_Employee, id = First(PowerBIIntegration.Data).'Employee ID')
      - lblTxtPlanTitle:
          Control: Label
          Properties:
            Text: ="Action (start segments with S1…S5) *"
            X: =488
            Y: =96
            Width: =440
            Height: =22
            Size: =10
            Color: =RGBA(96, 103, 96, 1)
      - txtPlanTitle:
          Control: Classic/TextInput
          Properties:
            X: =488
            Y: =120
            Width: =440
            Height: =40
            Default: =""
            HintText: =""
      - lblCbPlanActionType:
          Control: Label
          Properties:
            Text: ="Type *"
            X: =24
            Y: =170
            Width: =440
            Height: =22
            Size: =10
            Color: =RGBA(96, 103, 96, 1)
      - cbPlanActionType:
          Control: Classic/ComboBox
          Properties:
            X: =24
            Y: =194
            Width: =440
            Height: =40
            Items: =Sort(Filter(tbl_LookupValue, list = "idpActionType" && active), sortOrder)
            DisplayFields: =["value"]
            SearchFields: =["value"]
            SelectMultiple: =false
            DefaultSelectedItems: =Filter(tbl_LookupValue, list = "idpActionType" && value = "Learning Plan Segment")
      - lblCbPlanSkill:
          Control: Label
          Properties:
            Text: ="Skill"
            X: =488
            Y: =170
            Width: =440
            Height: =22
            Size: =10
            Color: =RGBA(96, 103, 96, 1)
      - cbPlanSkill:
          Control: Classic/ComboBox
          Properties:
            X: =488
            Y: =194
            Width: =440
            Height: =40
            Items: =SortByColumns(tbl_Competency, "name")
            DisplayFields: =["name"]
            SearchFields: =["name"]
            SelectMultiple: =false
      - lblCbPlanStatus:
          Control: Label
          Properties:
            Text: ="Status"
            X: =24
            Y: =244
            Width: =440
            Height: =22
            Size: =10
            Color: =RGBA(96, 103, 96, 1)
      - cbPlanStatus:
          Control: Classic/ComboBox
          Properties:
            X: =24
            Y: =268
            Width: =440
            Height: =40
            Items: =Sort(Filter(tbl_LookupValue, list = "idpStatus" && active), sortOrder)
            DisplayFields: =["value"]
            SearchFields: =["value"]
            SelectMultiple: =false
            DefaultSelectedItems: =Filter(tbl_LookupValue, list = "idpStatus" && value = "Planned")
      - lblTxtPlanProgressPct:
          Control: Label
          Properties:
            Text: ="Progress %"
            X: =488
            Y: =244
            Width: =440
            Height: =22
            Size: =10
            Color: =RGBA(96, 103, 96, 1)
      - txtPlanProgressPct:
          Control: Classic/TextInput
          Properties:
            X: =488
            Y: =268
            Width: =440
            Height: =40
            Default: ="0"
            Format: =TextFormat.Number
      - lblTxtPlanEstimatedHours:
          Control: Label
          Properties:
            Text: ="Estimated hours"
            X: =24
            Y: =318
            Width: =440
            Height: =22
            Size: =10
            Color: =RGBA(96, 103, 96, 1)
      - txtPlanEstimatedHours:
          Control: Classic/TextInput
          Properties:
            X: =24
            Y: =342
            Width: =440
            Height: =40
            Default: =""
            Format: =TextFormat.Number
      - lblDpPlanPlannedStart:
          Control: Label
          Properties:
            Text: ="Planned start"
            X: =488
            Y: =318
            Width: =440
            Height: =22
            Size: =10
            Color: =RGBA(96, 103, 96, 1)
      - dpPlanPlannedStart:
          Control: Classic/DatePicker
          Properties:
            X: =488
            Y: =342
            Width: =440
            Height: =40
            DefaultDate: =Today()
            Format: ="yyyy-mm-dd"
      - lblDpPlanPlannedEnd:
          Control: Label
          Properties:
            Text: ="Planned end"
            X: =24
            Y: =392
            Width: =440
            Height: =22
            Size: =10
            Color: =RGBA(96, 103, 96, 1)
      - dpPlanPlannedEnd:
          Control: Classic/DatePicker
          Properties:
            X: =24
            Y: =416
            Width: =440
            Height: =40
            DefaultDate: =Blank()
            Format: ="yyyy-mm-dd"
      - lblTxtPlanOwner:
          Control: Label
          Properties:
            Text: ="Owner"
            X: =488
            Y: =392
            Width: =440
            Height: =22
            Size: =10
            Color: =RGBA(96, 103, 96, 1)
      - txtPlanOwner:
          Control: Classic/TextInput
          Properties:
            X: =488
            Y: =416
            Width: =440
            Height: =40
            Default: =""
            HintText: =""
      - lblTxtPlanComments:
          Control: Label
          Properties:
            Text: ="Comments"
            X: =24
            Y: =466
            Width: =904
            Height: =22
            Size: =10
            Color: =RGBA(96, 103, 96, 1)
      - txtPlanComments:
          Control: Classic/TextInput
          Properties:
            X: =24
            Y: =490
            Width: =904
            Height: =72
            Default: =""
            Mode: =TextMode.MultiLine
            HintText: =""
      - lblCbPlanSource:
          Control: Label
          Properties:
            Text: ="Source"
            X: =24
            Y: =540
            Width: =440
            Height: =22
            Size: =10
            Color: =RGBA(96, 103, 96, 1)
      - cbPlanSource:
          Control: Classic/ComboBox
          Properties:
            X: =24
            Y: =564
            Width: =440
            Height: =40
            Items: =Sort(Filter(tbl_LookupValue, list = "source" && active), sortOrder)
            DisplayFields: =["value"]
            SearchFields: =["value"]
            SelectMultiple: =false
            DefaultSelectedItems: =Filter(tbl_LookupValue, list = "source" && value = "Direct entry")
      - btnPlanSave:
          Control: Classic/Button
          Properties:
            Text: ="Save"
            X: =24
            Y: =622
            Width: =160
            Height: =44
            Fill: =RGBA(147, 201, 38, 1)
            Color: =RGBA(20, 30, 18, 1)
            HoverFill: =RGBA(125, 176, 26, 1)
            RadiusTopLeft: =22
            RadiusTopRight: =22
            RadiusBottomLeft: =22
            RadiusBottomRight: =22
            DisplayMode: =If(IsBlank(cbPlanPerson.Selected.id) || IsBlank(txtPlanTitle.Text) || IsBlank(cbPlanActionType.Selected.value), DisplayMode.Disabled, DisplayMode.Edit)
            OnSelect: |-
              =Patch(tbl_IdpAction, Defaults(tbl_IdpAction), {
                  id: "IDP-PA" & Text(Now(), "yymmddhhmmss"),
                  employeeId: cbPlanPerson.Selected.id,
                  title: If(IsBlank(txtPlanTitle.Text), Blank(), txtPlanTitle.Text),
                  actionType: cbPlanActionType.Selected.value,
                  competencyId: cbPlanSkill.Selected.id,
                  status: cbPlanStatus.Selected.value,
                  progressPct: If(IsBlank(txtPlanProgressPct.Text), Blank(), Value(txtPlanProgressPct.Text)),
                  estimatedHours: If(IsBlank(txtPlanEstimatedHours.Text), Blank(), Value(txtPlanEstimatedHours.Text)),
                  plannedStart: If(IsBlank(dpPlanPlannedStart.SelectedDate), Blank(), Text(dpPlanPlannedStart.SelectedDate, "yyyy-mm-dd")),
                  plannedEnd: If(IsBlank(dpPlanPlannedEnd.SelectedDate), Blank(), Text(dpPlanPlannedEnd.SelectedDate, "yyyy-mm-dd")),
                  owner: If(IsBlank(txtPlanOwner.Text), Blank(), txtPlanOwner.Text),
                  comments: If(IsBlank(txtPlanComments.Text), Blank(), txtPlanComments.Text),
                  source: cbPlanSource.Selected.value,
                  createdAt: Text(Now(), "yyyy-mm-dd hh:mm:ss"),
                  createdBy: User().FullName,
                  updatedAt: Text(Now(), "yyyy-mm-dd hh:mm:ss"),
                  updatedBy: User().FullName
              });
              Notify("Development action saved. It appears in the report after the next refresh.", NotificationType.Success);
              Reset(txtPlanTitle); Reset(cbPlanActionType); Reset(cbPlanSkill); Reset(cbPlanStatus); Reset(txtPlanProgressPct); Reset(txtPlanEstimatedHours); Reset(dpPlanPlannedStart); Reset(dpPlanPlannedEnd); Reset(txtPlanOwner); Reset(txtPlanComments); Reset(cbPlanSource)
      - btnPlanClear:
          Control: Classic/Button
          Properties:
            Text: ="Clear"
            X: =200
            Y: =622
            Width: =120
            Height: =44
            Fill: =RGBA(255, 255, 255, 1)
            Color: =RGBA(20, 30, 18, 1)
            BorderColor: =RGBA(0, 26, 0, 0.15)
            BorderThickness: =1
            HoverFill: =RGBA(0, 39, 0, 0.05)
            RadiusTopLeft: =22
            RadiusTopRight: =22
            RadiusBottomLeft: =22
            RadiusBottomRight: =22
            OnSelect: =Reset(cbPlanPerson); Reset(txtPlanTitle); Reset(cbPlanActionType); Reset(cbPlanSkill); Reset(cbPlanStatus); Reset(txtPlanProgressPct); Reset(txtPlanEstimatedHours); Reset(dpPlanPlannedStart); Reset(dpPlanPlannedEnd); Reset(txtPlanOwner); Reset(txtPlanComments); Reset(cbPlanSource)
      - btnPlanBack:
          Control: Classic/Button
          Properties:
            Text: ="← Menu"
            X: =Parent.Width - 144
            Y: =20
            Width: =120
            Height: =36
            Fill: =RGBA(255, 255, 255, 1)
            Color: =RGBA(20, 30, 18, 1)
            BorderColor: =RGBA(0, 26, 0, 0.15)
            BorderThickness: =1
            OnSelect: =Navigate(scrMenu, ScreenTransition.None)
