- conCoaching:
    Control: GroupContainer
    Variant: ManualLayout
    Properties:
      X: =0
      Y: =0
      Width: =Parent.Width
      Height: =Parent.Height
      Fill: =RGBA(255, 255, 251, 1)
    Children:
      - lblCoachingTitle:
          Control: Label
          Properties:
            Text: ="Coaching session"
            X: =24
            Y: =16
            Width: =900
            Height: =40
            Size: =20
            FontWeight: =FontWeight.Semibold
            Color: =RGBA(20, 30, 18, 1)
      - lblCoachingSub:
          Control: Label
          Properties:
            Text: |-
              ="The coaching table: times, effort and notes per IDP segment."
            X: =24
            Y: =56
            Width: =900
            Height: =30
            Size: =11
            Color: =RGBA(107, 113, 106, 1)
      - lblCbCoachingPerson:
          Control: Label
          Properties:
            Text: ="Person *"
            X: =24
            Y: =96
            Width: =440
            Height: =22
            Size: =10
            Color: =RGBA(96, 103, 96, 1)
      - cbCoachingPerson:
          Control: Classic/ComboBox
          Properties:
            X: =24
            Y: =120
            Width: =440
            Height: =40
            Items: =SortByColumns(tbl_Employee, "name")
            DisplayFields: =["name"]
            SearchFields: =["name", "jobTitle", "id"]
            SelectMultiple: =false
            DefaultSelectedItems: =Filter(tbl_Employee, id = First(PowerBIIntegration.Data).'Employee ID')
      - lblDpCoachingDate:
          Control: Label
          Properties:
            Text: ="Coaching session date *"
            X: =488
            Y: =96
            Width: =440
            Height: =22
            Size: =10
            Color: =RGBA(96, 103, 96, 1)
      - dpCoachingDate:
          Control: Classic/DatePicker
          Properties:
            X: =488
            Y: =120
            Width: =440
            Height: =40
            DefaultDate: =Today()
            Format: ="yyyy-mm-dd"
      - lblCbCoachingType:
          Control: Label
          Properties:
            Text: ="Session type *"
            X: =24
            Y: =170
            Width: =440
            Height: =22
            Size: =10
            Color: =RGBA(96, 103, 96, 1)
      - cbCoachingType:
          Control: Classic/ComboBox
          Properties:
            X: =24
            Y: =194
            Width: =440
            Height: =40
            Items: =Sort(Filter(tbl_LookupValue, list = "coachingType" && active), sortOrder)
            DisplayFields: =["value"]
            SearchFields: =["value"]
            SelectMultiple: =false
            DefaultSelectedItems: =Filter(tbl_LookupValue, list = "coachingType" && value = "Monthly Check-In")
      - lblCbCoachingCoach:
          Control: Label
          Properties:
            Text: ="Coach"
            X: =488
            Y: =170
            Width: =440
            Height: =22
            Size: =10
            Color: =RGBA(96, 103, 96, 1)
      - cbCoachingCoach:
          Control: Classic/ComboBox
          Properties:
            X: =488
            Y: =194
            Width: =440
            Height: =40
            Items: =SortByColumns(Filter(tbl_Staff, "Coach" in roles), "name")
            DisplayFields: =["name"]
            SearchFields: =["name"]
            SelectMultiple: =false
      - lblCbCoachingStatus:
          Control: Label
          Properties:
            Text: ="Status"
            X: =24
            Y: =244
            Width: =440
            Height: =22
            Size: =10
            Color: =RGBA(96, 103, 96, 1)
      - cbCoachingStatus:
          Control: Classic/ComboBox
          Properties:
            X: =24
            Y: =268
            Width: =440
            Height: =40
            Items: =Sort(Filter(tbl_LookupValue, list = "coachingStatus" && active), sortOrder)
            DisplayFields: =["value"]
            SearchFields: =["value"]
            SelectMultiple: =false
            DefaultSelectedItems: =Filter(tbl_LookupValue, list = "coachingStatus" && value = "Completed")
      - lblTxtCoachingStartTime:
          Control: Label
          Properties:
            Text: |-
              ="1-1 session start (HH:MM)"
            X: =488
            Y: =244
            Width: =440
            Height: =22
            Size: =10
            Color: =RGBA(96, 103, 96, 1)
      - txtCoachingStartTime:
          Control: Classic/TextInput
          Properties:
            X: =488
            Y: =268
            Width: =440
            Height: =40
            Default: |-
              ="09:00"
            HintText: |-
              ="HH:MM"
      - lblTxtCoachingEndTime:
          Control: Label
          Properties:
            Text: |-
              ="1-1 session end (HH:MM)"
            X: =24
            Y: =318
            Width: =440
            Height: =22
            Size: =10
            Color: =RGBA(96, 103, 96, 1)
      - txtCoachingEndTime:
          Control: Classic/TextInput
          Properties:
            X: =24
            Y: =342
            Width: =440
            Height: =40
            Default: |-
              ="10:00"
            HintText: |-
              ="HH:MM"
      - lblTxtCoachingPrepMinutes:
          Control: Label
          Properties:
            Text: ="Preparation time (min)"
            X: =488
            Y: =318
            Width: =440
            Height: =22
            Size: =10
            Color: =RGBA(96, 103, 96, 1)
      - txtCoachingPrepMinutes:
          Control: Classic/TextInput
          Properties:
            X: =488
            Y: =342
            Width: =440
            Height: =40
            Default: ="15"
            Format: =TextFormat.Number
      - lblTxtCoachingDurationMinutes:
          Control: Label
          Properties:
            Text: ="Session (min)"
            X: =24
            Y: =392
            Width: =440
            Height: =22
            Size: =10
            Color: =RGBA(96, 103, 96, 1)
      - txtCoachingDurationMinutes:
          Control: Classic/TextInput
          Properties:
            X: =24
            Y: =416
            Width: =440
            Height: =40
            Default: ="60"
            Format: =TextFormat.Number
      - lblTxtCoachingReportingMinutes:
          Control: Label
          Properties:
            Text: ="Reporting time (min)"
            X: =488
            Y: =392
            Width: =440
            Height: =22
            Size: =10
            Color: =RGBA(96, 103, 96, 1)
      - txtCoachingReportingMinutes:
          Control: Classic/TextInput
          Properties:
            X: =488
            Y: =416
            Width: =440
            Height: =40
            Default: ="15"
            Format: =TextFormat.Number
      - lblTxtCoachingProgressPct:
          Control: Label
          Properties:
            Text: ="Overall IDP progress %"
            X: =24
            Y: =466
            Width: =440
            Height: =22
            Size: =10
            Color: =RGBA(96, 103, 96, 1)
      - txtCoachingProgressPct:
          Control: Classic/TextInput
          Properties:
            X: =24
            Y: =490
            Width: =440
            Height: =40
            Default: =""
            Format: =TextFormat.Number
      - lblTxtCoachingSummary:
          Control: Label
          Properties:
            Text: ="Segment notes (S1 cert · S2 immersive · S3 AI cert · S4 SuccessFactors · S5 cross-functional · department needs)"
            X: =24
            Y: =540
            Width: =904
            Height: =22
            Size: =10
            Color: =RGBA(96, 103, 96, 1)
      - txtCoachingSummary:
          Control: Classic/TextInput
          Properties:
            X: =24
            Y: =564
            Width: =904
            Height: =72
            Default: =""
            Mode: =TextMode.MultiLine
            HintText: =""
      - lblTxtCoachingChallenges:
          Control: Label
          Properties:
            Text: ="Challenges"
            X: =24
            Y: =614
            Width: =904
            Height: =22
            Size: =10
            Color: =RGBA(96, 103, 96, 1)
      - txtCoachingChallenges:
          Control: Classic/TextInput
          Properties:
            X: =24
            Y: =638
            Width: =904
            Height: =72
            Default: =""
            Mode: =TextMode.MultiLine
            HintText: =""
      - lblTxtCoachingActionItems:
          Control: Label
          Properties:
            Text: ="Action items"
            X: =24
            Y: =688
            Width: =904
            Height: =22
            Size: =10
            Color: =RGBA(96, 103, 96, 1)
      - txtCoachingActionItems:
          Control: Classic/TextInput
          Properties:
            X: =24
            Y: =712
            Width: =904
            Height: =72
            Default: =""
            Mode: =TextMode.MultiLine
            HintText: =""
      - lblDpCoachingNextReviewDate:
          Control: Label
          Properties:
            Text: ="Next review"
            X: =24
            Y: =762
            Width: =440
            Height: =22
            Size: =10
            Color: =RGBA(96, 103, 96, 1)
      - dpCoachingNextReviewDate:
          Control: Classic/DatePicker
          Properties:
            X: =24
            Y: =786
            Width: =440
            Height: =40
            DefaultDate: =Blank()
            Format: ="yyyy-mm-dd"
      - lblTglCoachingEvidenceSubmitted:
          Control: Label
          Properties:
            Text: ="Evidence submitted"
            X: =488
            Y: =762
            Width: =440
            Height: =22
            Size: =10
            Color: =RGBA(96, 103, 96, 1)
      - tglCoachingEvidenceSubmitted:
          Control: Classic/Toggle
          Properties:
            X: =488
            Y: =786
            Width: =440
            Height: =40
            Default: =false
      - lblCbCoachingSource:
          Control: Label
          Properties:
            Text: ="Source"
            X: =24
            Y: =836
            Width: =440
            Height: =22
            Size: =10
            Color: =RGBA(96, 103, 96, 1)
      - cbCoachingSource:
          Control: Classic/ComboBox
          Properties:
            X: =24
            Y: =860
            Width: =440
            Height: =40
            Items: =Sort(Filter(tbl_LookupValue, list = "source" && active), sortOrder)
            DisplayFields: =["value"]
            SearchFields: =["value"]
            SelectMultiple: =false
            DefaultSelectedItems: =Filter(tbl_LookupValue, list = "source" && value = "Direct entry")
      - btnCoachingSave:
          Control: Classic/Button
          Properties:
            Text: ="Save"
            X: =24
            Y: =918
            Width: =160
            Height: =44
            Fill: =RGBA(147, 201, 38, 1)
            Color: =RGBA(20, 30, 18, 1)
            HoverFill: =RGBA(125, 176, 26, 1)
            RadiusTopLeft: =22
            RadiusTopRight: =22
            RadiusBottomLeft: =22
            RadiusBottomRight: =22
            DisplayMode: =If(IsBlank(cbCoachingPerson.Selected.id) || IsBlank(dpCoachingDate.SelectedDate) || IsBlank(cbCoachingType.Selected.value), DisplayMode.Disabled, DisplayMode.Edit)
            OnSelect: |-
              =Patch(tbl_CoachingSession, Defaults(tbl_CoachingSession), {
                  id: "COA-PA" & Text(Now(), "yymmddhhmmss"),
                  employeeId: cbCoachingPerson.Selected.id,
                  date: If(IsBlank(dpCoachingDate.SelectedDate), Blank(), Text(dpCoachingDate.SelectedDate, "yyyy-mm-dd")),
                  type: cbCoachingType.Selected.value,
                  coachId: cbCoachingCoach.Selected.id,
                  status: cbCoachingStatus.Selected.value,
                  startTime: If(IsBlank(txtCoachingStartTime.Text), Blank(), txtCoachingStartTime.Text),
                  endTime: If(IsBlank(txtCoachingEndTime.Text), Blank(), txtCoachingEndTime.Text),
                  prepMinutes: If(IsBlank(txtCoachingPrepMinutes.Text), Blank(), Value(txtCoachingPrepMinutes.Text)),
                  durationMinutes: If(IsBlank(txtCoachingDurationMinutes.Text), Blank(), Value(txtCoachingDurationMinutes.Text)),
                  reportingMinutes: If(IsBlank(txtCoachingReportingMinutes.Text), Blank(), Value(txtCoachingReportingMinutes.Text)),
                  progressPct: If(IsBlank(txtCoachingProgressPct.Text), Blank(), Value(txtCoachingProgressPct.Text)),
                  summary: If(IsBlank(txtCoachingSummary.Text), Blank(), txtCoachingSummary.Text),
                  challenges: If(IsBlank(txtCoachingChallenges.Text), Blank(), txtCoachingChallenges.Text),
                  actionItems: If(IsBlank(txtCoachingActionItems.Text), Blank(), txtCoachingActionItems.Text),
                  nextReviewDate: If(IsBlank(dpCoachingNextReviewDate.SelectedDate), Blank(), Text(dpCoachingNextReviewDate.SelectedDate, "yyyy-mm-dd")),
                  evidenceSubmitted: tglCoachingEvidenceSubmitted.Value,
                  source: cbCoachingSource.Selected.value,
                  createdAt: Text(Now(), "yyyy-mm-dd hh:mm:ss"),
                  createdBy: User().FullName,
                  updatedAt: Text(Now(), "yyyy-mm-dd hh:mm:ss"),
                  updatedBy: User().FullName
              });
              Notify("Coaching session saved. It appears in the report after the next refresh.", NotificationType.Success);
              Reset(dpCoachingDate); Reset(cbCoachingType); Reset(cbCoachingCoach); Reset(cbCoachingStatus); Reset(txtCoachingStartTime); Reset(txtCoachingEndTime); Reset(txtCoachingPrepMinutes); Reset(txtCoachingDurationMinutes); Reset(txtCoachingReportingMinutes); Reset(txtCoachingProgressPct); Reset(txtCoachingSummary); Reset(txtCoachingChallenges); Reset(txtCoachingActionItems); Reset(dpCoachingNextReviewDate); Reset(tglCoachingEvidenceSubmitted); Reset(cbCoachingSource)
      - btnCoachingClear:
          Control: Classic/Button
          Properties:
            Text: ="Clear"
            X: =200
            Y: =918
            Width: =120
            Height: =44
            Fill: =RGBA(255, 255, 255, 1)
            Color: =RGBA(20, 30, 18, 1)
            BorderColor: =RGBA(0, 26, 0, 0.15)
            BorderThickness: =1
            HoverFill: =RGBA(0, 39, 0, 0.05)
            RadiusTopLeft: =22
            RadiusTopRight: =22
            RadiusBottomLeft: =22
            RadiusBottomRight: =22
            OnSelect: =Reset(cbCoachingPerson); Reset(dpCoachingDate); Reset(cbCoachingType); Reset(cbCoachingCoach); Reset(cbCoachingStatus); Reset(txtCoachingStartTime); Reset(txtCoachingEndTime); Reset(txtCoachingPrepMinutes); Reset(txtCoachingDurationMinutes); Reset(txtCoachingReportingMinutes); Reset(txtCoachingProgressPct); Reset(txtCoachingSummary); Reset(txtCoachingChallenges); Reset(txtCoachingActionItems); Reset(dpCoachingNextReviewDate); Reset(tglCoachingEvidenceSubmitted); Reset(cbCoachingSource)
      - btnCoachingBack:
          Control: Classic/Button
          Properties:
            Text: ="← Menu"
            X: =Parent.Width - 144
            Y: =20
            Width: =120
            Height: =36
            Fill: =RGBA(255, 255, 255, 1)
            Color: =RGBA(20, 30, 18, 1)
            BorderColor: =RGBA(0, 26, 0, 0.15)
            BorderThickness: =1
            OnSelect: =Navigate(scrMenu, ScreenTransition.None)
