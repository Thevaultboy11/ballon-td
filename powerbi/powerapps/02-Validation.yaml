- conValidation:
    Control: GroupContainer
    Variant: ManualLayout
    Properties:
      X: =0
      Y: =0
      Width: =Parent.Width
      Height: =Parent.Height
      Fill: =RGBA(255, 255, 251, 1)
    Children:
      - lblValidationTitle:
          Control: Label
          Properties:
            Text: ="Line-manager validation"
            X: =24
            Y: =16
            Width: =900
            Height: =40
            Size: =20
            FontWeight: =FontWeight.Semibold
            Color: =RGBA(20, 30, 18, 1)
      - lblValidationSub:
          Control: Label
          Properties:
            Text: ="Monthly progress per skill (1 Not started … 5 Fully achieved), after the coach's review meeting with the line manager."
            X: =24
            Y: =56
            Width: =900
            Height: =30
            Size: =11
            Color: =RGBA(107, 113, 106, 1)
      - lblCbValidationPerson:
          Control: Label
          Properties:
            Text: ="Person *"
            X: =24
            Y: =96
            Width: =440
            Height: =22
            Size: =10
            Color: =RGBA(96, 103, 96, 1)
      - cbValidationPerson:
          Control: Classic/ComboBox
          Properties:
            X: =24
            Y: =120
            Width: =440
            Height: =40
            Items: =SortByColumns(tbl_Employee, "name")
            DisplayFields: =["name"]
            SearchFields: =["name", "jobTitle", "id"]
            SelectMultiple: =false
            DefaultSelectedItems: =Filter(tbl_Employee, id = First(PowerBIIntegration.Data).'Employee ID')
      - lblCbValidationSkill:
          Control: Label
          Properties:
            Text: ="Skill *"
            X: =488
            Y: =96
            Width: =440
            Height: =22
            Size: =10
            Color: =RGBA(96, 103, 96, 1)
      - cbValidationSkill:
          Control: Classic/ComboBox
          Properties:
            X: =488
            Y: =120
            Width: =440
            Height: =40
            Items: =SortByColumns(tbl_Competency, "name")
            DisplayFields: =["name"]
            SearchFields: =["name"]
            SelectMultiple: =false
      - lblDpValidationDate:
          Control: Label
          Properties:
            Text: ="Validation date *"
            X: =24
            Y: =170
            Width: =440
            Height: =22
            Size: =10
            Color: =RGBA(96, 103, 96, 1)
      - dpValidationDate:
          Control: Classic/DatePicker
          Properties:
            X: =24
            Y: =194
            Width: =440
            Height: =40
            DefaultDate: =Today()
            Format: ="yyyy-mm-dd"
      - lblDdValidationValidatedLevel:
          Control: Label
          Properties:
            Text: ="Progress (1–5)"
            X: =488
            Y: =170
            Width: =440
            Height: =22
            Size: =10
            Color: =RGBA(96, 103, 96, 1)
      - ddValidationValidatedLevel:
          Control: Classic/DropDown
          Properties:
            X: =488
            Y: =194
            Width: =440
            Height: =40
            Items: =[1, 2, 3, 4, 5]
            Default: =3
      - lblCbValidationStatus:
          Control: Label
          Properties:
            Text: ="Status *"
            X: =24
            Y: =244
            Width: =440
            Height: =22
            Size: =10
            Color: =RGBA(96, 103, 96, 1)
      - cbValidationStatus:
          Control: Classic/ComboBox
          Properties:
            X: =24
            Y: =268
            Width: =440
            Height: =40
            Items: =Sort(Filter(tbl_LookupValue, list = "validationStatus" && active), sortOrder)
            DisplayFields: =["value"]
            SearchFields: =["value"]
            SelectMultiple: =false
            DefaultSelectedItems: =Filter(tbl_LookupValue, list = "validationStatus" && value = "Approved")
      - lblCbValidationManager:
          Control: Label
          Properties:
            Text: ="Line manager"
            X: =488
            Y: =244
            Width: =440
            Height: =22
            Size: =10
            Color: =RGBA(96, 103, 96, 1)
      - cbValidationManager:
          Control: Classic/ComboBox
          Properties:
            X: =488
            Y: =268
            Width: =440
            Height: =40
            Items: =SortByColumns(tbl_Employee, "name")
            DisplayFields: =["name"]
            SearchFields: =["name"]
            SelectMultiple: =false
      - lblTxtValidationEvidenceReviewed:
          Control: Label
          Properties:
            Text: ="Evidence reviewed"
            X: =24
            Y: =318
            Width: =440
            Height: =22
            Size: =10
            Color: =RGBA(96, 103, 96, 1)
      - txtValidationEvidenceReviewed:
          Control: Classic/TextInput
          Properties:
            X: =24
            Y: =342
            Width: =440
            Height: =40
            Default: =""
            HintText: =""
      - lblTxtValidationComments:
          Control: Label
          Properties:
            Text: ="Comments"
            X: =24
            Y: =392
            Width: =904
            Height: =22
            Size: =10
            Color: =RGBA(96, 103, 96, 1)
      - txtValidationComments:
          Control: Classic/TextInput
          Properties:
            X: =24
            Y: =416
            Width: =904
            Height: =72
            Default: =""
            Mode: =TextMode.MultiLine
            HintText: =""
      - lblCbValidationSource:
          Control: Label
          Properties:
            Text: ="Source"
            X: =24
            Y: =466
            Width: =440
            Height: =22
            Size: =10
            Color: =RGBA(96, 103, 96, 1)
      - cbValidationSource:
          Control: Classic/ComboBox
          Properties:
            X: =24
            Y: =490
            Width: =440
            Height: =40
            Items: =Sort(Filter(tbl_LookupValue, list = "source" && active), sortOrder)
            DisplayFields: =["value"]
            SearchFields: =["value"]
            SelectMultiple: =false
            DefaultSelectedItems: =Filter(tbl_LookupValue, list = "source" && value = "Email from client")
      - btnValidationSave:
          Control: Classic/Button
          Properties:
            Text: ="Save"
            X: =24
            Y: =548
            Width: =160
            Height: =44
            Fill: =RGBA(147, 201, 38, 1)
            Color: =RGBA(20, 30, 18, 1)
            HoverFill: =RGBA(125, 176, 26, 1)
            RadiusTopLeft: =22
            RadiusTopRight: =22
            RadiusBottomLeft: =22
            RadiusBottomRight: =22
            DisplayMode: =If(IsBlank(cbValidationPerson.Selected.id) || IsBlank(cbValidationSkill.Selected) || IsBlank(dpValidationDate.SelectedDate) || IsBlank(cbValidationStatus.Selected.value), DisplayMode.Disabled, DisplayMode.Edit)
            OnSelect: |-
              =Patch(tbl_ManagerValidation, Defaults(tbl_ManagerValidation), {
                  id: "VAL-PA" & Text(Now(), "yymmddhhmmss"),
                  employeeId: cbValidationPerson.Selected.id,
                  competencyId: cbValidationSkill.Selected.id,
                  date: If(IsBlank(dpValidationDate.SelectedDate), Blank(), Text(dpValidationDate.SelectedDate, "yyyy-mm-dd")),
                  validatedLevel: ddValidationValidatedLevel.Selected.Value,
                  status: cbValidationStatus.Selected.value,
                  managerId: cbValidationManager.Selected.id,
                  evidenceReviewed: If(IsBlank(txtValidationEvidenceReviewed.Text), Blank(), txtValidationEvidenceReviewed.Text),
                  comments: If(IsBlank(txtValidationComments.Text), Blank(), txtValidationComments.Text),
                  source: cbValidationSource.Selected.value,
                  createdAt: Text(Now(), "yyyy-mm-dd hh:mm:ss"),
                  createdBy: User().FullName,
                  updatedAt: Text(Now(), "yyyy-mm-dd hh:mm:ss"),
                  updatedBy: User().FullName
              });
              Notify("Line-manager validation saved. It appears in the report after the next refresh.", NotificationType.Success);
              Reset(cbValidationSkill); Reset(dpValidationDate); Reset(ddValidationValidatedLevel); Reset(cbValidationStatus); Reset(cbValidationManager); Reset(txtValidationEvidenceReviewed); Reset(txtValidationComments); Reset(cbValidationSource)
      - btnValidationClear:
          Control: Classic/Button
          Properties:
            Text: ="Clear"
            X: =200
            Y: =548
            Width: =120
            Height: =44
            Fill: =RGBA(255, 255, 255, 1)
            Color: =RGBA(20, 30, 18, 1)
            BorderColor: =RGBA(0, 26, 0, 0.15)
            BorderThickness: =1
            HoverFill: =RGBA(0, 39, 0, 0.05)
            RadiusTopLeft: =22
            RadiusTopRight: =22
            RadiusBottomLeft: =22
            RadiusBottomRight: =22
            OnSelect: =Reset(cbValidationPerson); Reset(cbValidationSkill); Reset(dpValidationDate); Reset(ddValidationValidatedLevel); Reset(cbValidationStatus); Reset(cbValidationManager); Reset(txtValidationEvidenceReviewed); Reset(txtValidationComments); Reset(cbValidationSource)
      - btnValidationBack:
          Control: Classic/Button
          Properties:
            Text: ="← Menu"
            X: =Parent.Width - 144
            Y: =20
            Width: =120
            Height: =36
            Fill: =RGBA(255, 255, 255, 1)
            Color: =RGBA(20, 30, 18, 1)
            BorderColor: =RGBA(0, 26, 0, 0.15)
            BorderThickness: =1
            OnSelect: =Navigate(scrMenu, ScreenTransition.None)
